[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-experience-tool-optimizer"
version = "0.1.0"
description = "Experience-driven tool-use optimization for Hermes Agent"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "EBTTO Open-Source Project"}]
 classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Migrations are loaded from the INSTALLED package at runtime
# (storage.py::MIGRATIONS_DIR = Path(__file__).parent / "migrations"), so the .sql
# files must ship in the wheel or every install silently runs with a v1 schema.
hermes_ebtto = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
