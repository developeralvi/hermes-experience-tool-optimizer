name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONUNBUFFERED: 1
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  # ── Unit, integration, contract ──────────────────────────────────────────
  test-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run unit tests
        run: python -m pytest tests/unit -v --tb=short

  # ── Security suite ───────────────────────────────────────────────────────
  test-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run security tests
        run: python -m pytest tests/security -v --tb=short

  # ── Regression suite ─────────────────────────────────────────────────────
  test-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run regression tests
        run: python -m pytest tests/regression -v --tb=short

  # ── Contract suite ───────────────────────────────────────────────────────
  test-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run contract tests
        run: python -m pytest tests/contract -v --tb=short

  # ── Integration suite ────────────────────────────────────────────────────
  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run integration tests
        run: python -m pytest tests/integration -v --tb=short

  # ── Benchmark smoke ──────────────────────────────────────────────────────
  test-benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run benchmark smoke test (a small subset only)
        run: |
          python -m pytest tests/benchmark -v --tb=short --benchmark-only --benchmark-autosave
        continue-on-error: true

  # ── Lint ─────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run Ruff
        run: ruff check --output-format=github src tests

      - name: Run Ruff format check
        run: ruff format --check --diff src tests

  # ── Type check ───────────────────────────────────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mypy
        run: python -m pip install mypy

      - name: Run MyPy
        run: mypy src --ignore-missing-imports --no-error-summary || true

  # ── Package build ────────────────────────────────────────────────────────
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: python -m pip install build

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel --no-isolation

      - name: Verify artifacts
        run: |
          ls -la dist/

  # ── Secret scan ──────────────────────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        run: |
          if git grep -lE \
              -e 'sk-[A-Za-z0-9]{20,}' \
              -e 'xox[baprs]-' \
              -e 'AKIA[0-9A-Z]{16}' \
              -e 'BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY' \
              -e 'eyJ' \
              -- '*.py' '*.yaml' '*.yml' '*.toml' '*.md' '*.txt' '*.json' '*.cfg' '*.ini' '*.env' '.env*'; then
            echo "Secret-like strings found in tracked files!"
            git grep -n -e 'sk-[A-Za-z0-9]{20,}' \
                -e 'xox[baprs]-' \
                -e 'AKIA[0-9A-Z]{16}' \
                -e 'BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY' \
                -e 'eyJ' \
                -- '*.py' '*.yaml' '*.yml' '*.toml' '*.md' '*.txt' '*.json' '*.cfg' '*.ini' '*.env' '.env*'
            exit 1
          fi
          echo "No secrets detected."
