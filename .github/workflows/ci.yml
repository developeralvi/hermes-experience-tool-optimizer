name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONUNBUFFERED: 1
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  # ── Unit + benchmark suite (Python matrix) ───────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run offline test suite
        run: python -m pytest tests -v --tb=short

  # ── Plugin manifest + import/discovery checks ────────────────────────────
  plugin-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Validate manifests
        run: |
          python -c "
          import yaml
          for path in ('plugin/plugin.yaml', 'src/hermes_ebtto/plugin.yaml'):
              with open(path) as fh:
                  d = yaml.safe_load(fh)
              assert d['name'] == 'hermes-ebtto', path
              assert d['main'] == 'hermes_ebtto.plugins', path
              for hook in ('pre_llm_call', 'pre_tool_call', 'post_tool_call', 'on_session_end'):
                  assert hook in d['provides_hooks'], (path, hook)
          print('plugin manifests OK')
          "

      - name: Verify import + register entry point
        run: |
          python -c "
          import hermes_ebtto
          import hermes_ebtto.plugins as p
          assert callable(p.register), 'module-level register(ctx) missing'
          assert hermes_ebtto.__version__ == '0.1.0'
          from hermes_ebtto.storage import MIGRATIONS_DIR
          assert sorted(f.stem for f in MIGRATIONS_DIR.glob('*.sql')) == ['1', '2', '3'], 'migrations missing from installed package'
          print('import + register + migrations OK')
          "

  # ── Lint (ruff) ──────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run Ruff
        run: ruff check src tests

      - name: Run Ruff format check
        run: ruff format --check --diff src tests

  # ── Type check (mypy) ────────────────────────────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install mypy
        run: python -m pip install mypy

      - name: Run MyPy
        run: mypy src --ignore-missing-imports

  # ── Package build + clean install ────────────────────────────────────────
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build
        run: python -m pip install build

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel

      - name: Verify artifacts
        run: ls -la dist/

      - name: Clean-venv install + import check
        run: |
          python -m venv /tmp/ebtto-clean
          /tmp/ebtto-clean/bin/python -m pip install --quiet dist/*.whl
          /tmp/ebtto-clean/bin/python -c "
          import hermes_ebtto, hermes_ebtto.plugins as p
          assert callable(p.register)
          print('clean install import OK:', hermes_ebtto.__version__)
          "

  # ── Secret scan (tracked files only) ─────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        run: |
          set -e
          patterns=(
            -e 'sk-[A-Za-z0-9]{20,}'
            -e 'xox[baprs]-[A-Za-z0-9-]{10,}'
            -e 'AKIA[0-9A-Z]{16}'
            -e 'gho_[A-Za-z0-9]{20,}'
            -e 'ghp_[A-Za-z0-9]{20,}'
            -e '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
          )
          if git grep -l "${patterns[@]}" -- '*.py' '*.yaml' '*.yml' '*.toml' '*.cfg' '*.ini' '*.json' '*.sql' '*.md'; then
            echo "::error::Secret-like strings found in tracked files"
            exit 1
          fi
          echo "No secrets detected."
