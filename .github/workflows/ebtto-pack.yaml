name: EBTTO
description: Experience-Based Tool Trajectory Optimization for Hermes Agent
author: EBTTO Open-Source Project
homepage: https://github.com/developeralvi/hermes-experience-tool-optimizer
repository: https://github.com/developeralvi/hermes-experience-tool-optimizer
bugs: https://github.com/developeralvi/hermes-experience-tool-optimizer/issues

usage:
  - hermes ebtto status
  - hermes ebtto stats
  - hermes ebtto tools
  - hermes ebtto tasks
  - hermes ebtto patterns
  - hermes ebtto strategies
  - hermes ebtto failures
  - hermes ebtto regressions
  - hermes ebtto trajectory
  - hermes ebtto benchmark
  - hermes ebtto replay
  - hermes ebtto export
  - hermes ebtto prune
  - hermes ebtto reset
  - hermes ebtto mode
  - hermes ebtto doctor

plugins:
  - name: hermes-ebtto
    version: 0.1.0
    description: Experience-Based Tool Trajectory Optimization for Hermes Agent
    main: hermes_ebtto.plugins
    provides_hooks:
      - pre_llm_call
      - pre_tool_call
      - post_tool_call
      - on_session_start
      - on_session_end
    disable: false
