name: "EBTTO Issue Templates"

description: "Issue templates for EBTTO bug reports and feature requests"

body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to fill out this issue! Please fill in the sections below."

  - type: dropdown
    id: issue_type
    attributes:
      label: Issue type
      description: What kind of issue is this?
      options:
        - Bug report
        - Feature request
        - Question
        - Documentation
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe the issue clearly.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Run `hermes ebtto ...`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.

  - type: input
    id: hermes_version
    attributes:
      label: Hermes version
      description: e.g. 0.21.5+8861
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      description: e.g. 3.11

  - type: dropdown
    id: mode
    attributes:
      label: EBTTO mode
      options:
        - record_only
        - advisory
        - auto
        - off
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      description: By submitting this issue, you agree to follow our Code of Conduct.
      options:
        - label: I agree to follow the project's Code of Conduct
          required: true

---
name: Feature Request
description: Suggest an idea for EBTTO
body:
  - type: markdown
    attributes:
      value: "Thanks for your interest in EBTTO!"

  - type: dropdown
    id: feature_category
    attributes:
      label: Feature category
      options:
        - Core plugin
        - CLI
        - Storage
        - Learning
        - Retrieval
        - Privacy/Security
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds?

  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      description: By submitting this issue, you agree to follow our Code of Conduct.
      options:
        - label: I agree to follow the project's Code of Conduct
          required: true
