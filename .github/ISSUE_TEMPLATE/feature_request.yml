name: "EBTTO Feature Request"

description: "Feature request template for EBTTO"
body:
  - type: markdown
    attributes:
      value: "Thanks for your interest in improving EBTTO!"

  - type: dropdown
    id: feature_category
    attributes:
      label: Feature category
      options:
        - Core plugin
        - CLI
        - Storage
        - Learning
        - Retrieval
        - Privacy / Security
        - Documentation
        - Testing
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds?

  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      description: By submitting this issue, you agree to follow our Code of Conduct.
      options:
        - label: I agree to follow the project's Code of Conduct
          required: true
