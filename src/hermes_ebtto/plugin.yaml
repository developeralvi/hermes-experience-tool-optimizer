name: hermes-ebtto
version: 0.1.0
description: Experience-Based Tool Trajectory Optimization for Hermes Agent
main: hermes_ebtto.plugins
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_end
config_schema:
  mode:
    type: string
    default: record_only
    description: >-
      EBTTO operating mode. One of: off, record_only, shadow, advisory,
      guarded, controlled_auto. record_only persists evidence without
      injecting guidance; shadow records and logs would-be guidance;
      advisory injects guidance as suggestions; guarded requires approval;
      controlled_auto applies the learned strategy automatically.
